services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mousetrap
      POSTGRES_PASSWORD: mousetrap
      POSTGRES_DB: mousetrap
    ports:
      - "5432:5432" # exposed for host-side prisma/dev; remove on the demo host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mousetrap"]
      interval: 3s
      timeout: 3s
      retries: 20

  ml:
    build: ./services/ml
    env_file: .env
    expose:
      - "8000" # internal only
    volumes:
      - mlmodels:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  pgdata:
  mlmodels:
